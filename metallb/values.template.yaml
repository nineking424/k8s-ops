# MetalLB values
# Chart: metallb/metallb (0.15.3)
#
# 모드: L2 (Layer-2 advertisement). 노드들이 같은 L2 broadcast domain
# (192.168.0.0/16)에 있어 ARP/NDP로 LoadBalancer IP를 announce.
#
# IPAddressPool / L2Advertisement는 CRD라 helm chart로는 설치 후
# 별도 yaml(ipaddresspool.yaml, l2advertisement.yaml)로 적용한다.
# 차트는 controller + speaker DaemonSet + CRD/webhook만 담당.

# 차트 기본값을 그대로 쓰는 항목이 많아 빈 설정으로 두어도 동작.
# speaker는 기본적으로 cp 노드 toleration이 포함되어 있어 cp/worker 모두에 배포됨.

controller:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

speaker:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi
  # 기본 toleration이 cp:NoSchedule을 포함하므로 추가 변경 불필요.
  # frr 모드는 BGP용 — L2만 쓸 거라 비활성(차트 기본).
  frr:
    enabled: false

# CRD/Webhook은 차트가 자동 설치 (crds.enabled=true 기본)
crds:
  enabled: true
  validationFailurePolicy: Fail
