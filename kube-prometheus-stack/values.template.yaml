# kube-prometheus-stack values
# Chart: prometheus-community/kube-prometheus-stack (84.5.0, app v0.90.1)
#
# 핵심 결정:
# - Storage: nfs-client SC (default). Prometheus 20Gi(7d/18GB cap), Alertmanager 2Gi, Grafana 5Gi.
# - 외부 노출: Grafana만 Ingress (host grafana.k8s.stjeong.com, HTTP).
#   외부 nginx proxy manager가 *.k8s.stjeong.com → 192.168.3.10:80 forward + TLS 종단.
#   따라서 Ingress에는 tls 섹션 없음. Grafana root_url은 https://...로 명시.
# - Prometheus/Alertmanager는 ClusterIP (port-forward 접근).
# - Talos 특수성: kube-controller-manager / kube-scheduler / kube-proxy / etcd 메트릭은 비공개 → 비활성화.
# - node-exporter(DaemonSet)는 hostNetwork/hostPID/hostPath 사용 → ns에 PSA privileged 라벨 필요(install.sh 처리).

# --- Prometheus Operator ---
prometheusOperator:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
    limits:
      memory: 200Mi

# --- Prometheus ---
prometheus:
  enabled: true
  service:
    type: ClusterIP
  prometheusSpec:
    retention: 7d
    retentionSize: "18GB"  # 20Gi PVC에서 2GiB 헤드룸
    # 모든 ns의 ServiceMonitor/PodMonitor/PrometheusRule을 자동 발견
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          storageClassName: nfs-client
          resources:
            requests:
              storage: 20Gi
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        memory: 4Gi

# --- Alertmanager ---
alertmanager:
  enabled: true
  service:
    type: ClusterIP
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          storageClassName: nfs-client
          resources:
            requests:
              storage: 2Gi
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi

# --- Grafana ---
grafana:
  enabled: true
  adminUser: admin
  # adminPassword 미설정 → 차트가 랜덤 생성, kube-prometheus-stack-grafana Secret에 저장
  defaultDashboardsEnabled: true
  service:
    type: ClusterIP
  persistence:
    enabled: true
    type: pvc
    storageClassName: nfs-client
    accessModes: ["ReadWriteOnce"]
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi
  # NPM이 HTTPS 종단 → Grafana는 외부 URL이 HTTPS임을 알아야 함(redirect/링크).
  # NPM이 X-Forwarded-Proto: https를 보내므로 이론적으론 자동 인지 가능하지만,
  # root_url을 명시해 두면 모든 경로에서 안전.
  grafana.ini:
    server:
      domain: grafana.k8s.stjeong.com
      root_url: "https://grafana.k8s.stjeong.com"
      serve_from_sub_path: false
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - grafana.k8s.stjeong.com
    path: /
    pathType: Prefix
    # tls: [] — 명시 X. 외부 NPM이 TLS 종단하고 ingress-nginx로는 HTTP만 들어옴.

# --- 클러스터 컴포넌트 ServiceMonitors ---
# Talos는 cp-side 컴포넌트 메트릭을 기본적으로 노출하지 않음(127.0.0.1 바인딩).
# 활성화하려면 Talos machine config 패치 필요 — YAGNI로 비활성화.
kubeApiServer:
  enabled: true
kubelet:
  enabled: true
coreDns:
  enabled: true
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false   # Talos는 Flannel + kube-proxy 미배포
kubeEtcd:
  enabled: false

# --- node-exporter (DaemonSet, 모든 노드) ---
nodeExporter:
  enabled: true

# --- kube-state-metrics ---
kube-state-metrics:
  enabled: true

# --- 기본 알림 규칙 ---
defaultRules:
  create: true
